name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + Django checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r railmind_django/requirements.txt -r agents/requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Django system checks
        working-directory: railmind_django
        run: python manage.py check
      - name: Core engine smoke run
        run: python -m railmind.main

  console:
    name: Console (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railmind-projec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in step with local dev (npm 11 wrote package-lock.json;
          # npm 10 refuses it)
          node-version: 24
          cache: npm
          cache-dependency-path: railmind-projec/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
